<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="قياس ذاتي في 5 دقائق: أين يذهب وقتك، وكم يعود منه إلى أسرتك وصحتك ومجتمعك، وما الذي يستنزف طاقتك.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>بوصلة الحياة الرقمية الكريمة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
/* Layout: one calm column, a journey of six short screens ending in a personal dossier. */
:root{
  --bg:#F3F6F3; --surface:#FFFFFF; --sunk:#E9EFEA; --ink:#14211C; --muted:#5A6A62; --line:#D6DFD9;
  --accent:#175C4C; --accent-ink:#FFFFFF; --accent-soft:#DCEDE6;
  --time:#B8730F; --time-soft:#F7EAD3;
  --fam:#B0435A; --hea:#4A7F35; --soc:#2A6A8C; --dig:#6556A3;
  --good:#2F7A4F; --warn:#A86A0C; --crit:#A63A3A; --crit-soft:#F6E1DF;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1613; --surface:#16211D; --sunk:#1C2924; --ink:#E6EEEA; --muted:#9BAEA5; --line:#2A3A34;
  --accent:#62C3A0; --accent-ink:#0B1411; --accent-soft:#1E3A31;
  --time:#E9AC4C; --time-soft:#3A2C14;
  --fam:#E58399; --hea:#93C67A; --soc:#73B6DA; --dig:#AFA2EA;
  --good:#7BCB98; --warn:#E7B460; --crit:#F08C84; --crit-soft:#3B2220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#16211D; --sunk:#1C2924; --ink:#E6EEEA; --muted:#9BAEA5; --line:#2A3A34;
  --accent:#62C3A0; --accent-ink:#0B1411; --accent-soft:#1E3A31;
  --time:#E9AC4C; --time-soft:#3A2C14;
  --fam:#E58399; --hea:#93C67A; --soc:#73B6DA; --dig:#AFA2EA;
  --good:#7BCB98; --warn:#E7B460; --crit:#F08C84; --crit-soft:#3B2220; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:720px;margin-inline:auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.35;text-wrap:balance;margin:0}
p{margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.3}
.brand small{display:block;color:var(--muted);font-size:12px;letter-spacing:.02em}
.top-actions{display:flex;gap:8px;align-items:center}
.chip-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.chip-btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* progress */
.progress{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-block:4px 22px}
.progress span{height:6px;border-radius:6px;background:var(--line)}
.progress span.done{background:var(--accent)}
.progress span.now{background:var(--accent);opacity:.55}
.step-label{color:var(--muted);font-size:13px;margin-bottom:6px;letter-spacing:.02em}

/* intro */
.hero{display:grid;gap:16px;padding-block:18px 8px}
.eyebrow{color:var(--accent);font-weight:600;font-size:14px;letter-spacing:.03em}
.hero h1{font-size:clamp(28px,6vw,40px)}
.hero p.lede{font-size:17px;color:var(--ink);max-width:60ch}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.facts span{background:var(--sunk);border-radius:999px;padding:4px 12px;font-size:14px}
.cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn{border:0;border-radius:12px;padding:12px 22px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-size:16px}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{color:var(--muted);font-size:14px}

.sample{margin-top:22px;border:1px dashed var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;background:var(--surface)}
.sample-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tag{font-size:12px;border-radius:999px;padding:2px 10px;background:var(--sunk);color:var(--muted)}

/* questions */
.section-head{display:grid;gap:6px;margin-bottom:16px}
.section-head h2{font-size:clamp(22px,4.6vw,28px)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px;display:grid;gap:10px;min-width:0}
.q-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.frame{font-size:12px;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.q-text{font-weight:600;font-size:16.5px}
.q-ex{color:var(--muted);font-size:14px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opts.cols1{grid-template-columns:1fr}
.opt{position:relative;display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;min-width:0;background:var(--surface);font-size:15px;line-height:1.5}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--muted)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt:has(input:checked) .dot{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 45%,transparent 50%)}
.opt:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.opt.sq .dot{border-radius:5px}
.opt.sq:has(input:checked) .dot{background:var(--accent)}
.lvl{flex:none;font-size:11px;color:var(--muted);width:16px;text-align:center}
.who-grid .opts{grid-template-columns:repeat(3,minmax(0,1fr))}
.ladder{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}
.ladder label{display:grid;place-items:center;height:44px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;font-weight:600;background:var(--surface)}
.ladder input{position:absolute;opacity:0;pointer-events:none}
.ladder label:has(input:checked){background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ladder label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.ladder-ends{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:8px;align-items:center;flex-wrap:wrap}
.warn-msg{color:var(--crit);font-size:14px}

/* report */
.report{display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px;min-width:0}
.card h3{font-size:19px}
.persona{display:grid;gap:10px}
.persona .who{font-size:13px;color:var(--muted)}
.persona h2{font-size:clamp(26px,5.5vw,34px)}
.score-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.dial{flex:none}
.score-text{display:grid;gap:4px;min-width:0;flex:1}
.band{display:inline-block;width:max-content;border-radius:999px;padding:3px 12px;font-weight:600;font-size:14px;background:var(--accent-soft);color:var(--accent)}
.meta-line{color:var(--muted);font-size:14px}
.dims{display:grid;gap:14px}
.dim{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.dim .name{font-weight:600}
.dim .val{font-weight:600}
.bar{grid-column:1 / -1;height:10px;border-radius:10px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:10px}
.dim .lab{grid-column:1 / -1;font-size:13px;color:var(--muted)}
.time-card{background:var(--time-soft);border-color:transparent}
.time-big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.time-big b{font-family:var(--f-display);font-size:clamp(40px,9vw,56px);line-height:1;color:var(--time)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:13px;border-radius:999px;padding:2px 10px;background:var(--surface);border:1px solid var(--line)}
.scale{position:relative;height:38px;margin-top:6px}
.scale .track{position:absolute;inset-inline:0;top:14px;height:10px;border-radius:10px;background:var(--sunk)}
.scale .fill{position:absolute;top:14px;height:10px;border-radius:10px;background:var(--accent);inset-inline-start:0}
.scale .mark{position:absolute;top:6px;width:2px;height:26px;background:var(--ink)}
.scale-legend{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.insight{border-inline-start:4px solid var(--accent);padding-inline-start:12px}
.support{background:var(--crit-soft);border-radius:12px;padding:12px 14px;font-size:15px}
.support b{white-space:nowrap}
.plan{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.plan li{display:flex;gap:10px;align-items:flex-start}
.plan .box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--accent);margin-top:3px}
.plan small{display:block;color:var(--muted);font-size:13px}
.share{display:grid;gap:10px}
.share-row{display:flex;flex-wrap:wrap;gap:8px}
.share-row a,.share-row button{display:inline-flex;align-items:center;gap:8px;border-radius:12px;padding:10px 14px;font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.share-row .wa{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toast{min-height:1.5em;font-size:14px;color:var(--accent)}
textarea.copybox{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--sunk);color:var(--ink);font:inherit;font-size:14px}
.foot{color:var(--muted);font-size:13px;margin-top:6px}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--sunk);border-radius:12px;padding:12px;display:grid;gap:2px}
.kpi b{font-family:var(--f-display);font-size:28px;line-height:1.2}
.kpi span{font-size:13px;color:var(--muted)}
.hbars{display:grid;gap:8px}
.hbar{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:14px}
.hbar .t{height:10px;background:var(--sunk);border-radius:10px;overflow:hidden}
.hbar .t i{display:block;height:100%;background:var(--accent);border-radius:10px}
@media (max-width:480px){
  .opts{grid-template-columns:1fr}
  .who-grid .opts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ladder{grid-template-columns:repeat(6,minmax(0,1fr))}
  .hbar{grid-template-columns:minmax(80px,120px) minmax(0,1fr) 40px}
}
@media (prefers-reduced-motion:no-preference){
  .bar i,.scale .fill{transition:width .6s ease}
  .view{animation:rise .35s ease both}
  @keyframes rise{from{transform:translateY(6px)}to{transform:none}}
}

/* v2 additions */
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.duo>div{min-width:0}
.sub{font-size:13px;color:var(--muted);margin-top:-6px}
.parts{display:grid;gap:12px}
.parts .dim .lab{font-size:12.5px}
.reading{border-inline-start:4px solid var(--warn);padding-inline-start:12px}
.reading.calm{border-inline-start-color:var(--good)}
.tiny{font-size:12.5px;color:var(--muted)}
.decision{background:var(--accent-soft);border-color:transparent}
.decision .head{font-family:var(--f-display);font-size:clamp(20px,4.6vw,26px);font-weight:600;line-height:1.35;color:var(--accent)}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
.tbl th{font-weight:600;color:var(--muted);font-size:13px;white-space:normal;vertical-align:bottom}
.tbl button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 8px;font-size:13px;cursor:pointer;color:var(--ink)}
.deltas{display:flex;flex-wrap:wrap;gap:8px}
.deltas span{border-radius:999px;padding:3px 12px;font-size:13.5px;background:var(--sunk)}
.deltas .up{color:var(--good)} .deltas .down{color:var(--crit)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.14em;font-weight:600;font-size:18px;direction:ltr;unicode-bidi:isolate}
.pid-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pid-row input{border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:9.5em;background:var(--surface);direction:ltr;text-transform:uppercase;letter-spacing:.1em}
.banner{background:var(--time-soft);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.linkbtn{display:inline-flex;align-items:center;gap:8px;border-radius:12px;padding:12px 20px;font-weight:600;text-decoration:none;background:var(--accent);color:var(--accent-ink)}
@media (max-width:520px){.duo{grid-template-columns:1fr}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <circle cx="17" cy="17" r="15" fill="none" stroke="var(--accent)" stroke-width="2"/>
        <path d="M17 6 L20 17 L17 28 L14 17 Z" fill="var(--accent)"/>
        <circle cx="17" cy="17" r="2.2" fill="var(--time)"/>
      </svg>
      <div><b id="brandName"></b><small id="brandTag"></small></div>
    </div>
    <div class="top-actions">
      <button class="chip-btn" id="dashBtn" hidden></button>
      <button class="chip-btn" id="langBtn" aria-label="Language"></button>
    </div>
  </header>
  <main id="app" aria-live="polite"></main>
</div>

<script>

اة، الأبناء، الوالدان)؟","en":"In the past 7 days, how much fully focused time did you give someone close to you (spouse, children, parents)?","opts_ar":["تواصل سريع فقط وغير منتظم","15 إلى 29 دقيقة في بعض الأيام","30 إلى 44 دقيقة في معظم الأيام","45 دقيقة أو أكثر يومياً"],"opts_en":["Only quick, irregular contact","15 to 29 minutes on some days","30 to 44 minutes on most days","45 minutes or more every day"],"ex_ar":"متابعة الأبناء، حديث مع شريك الحياة، مساعدة أحد الوالدين","ex_en":"Checking in with the kids, a real talk with your spouse, helping a parent","tip_ar":"خصص 15 دقيقة قبل النوم لحديث بتركيز كامل مع شخص قريب منك.","tip_en":"Give someone close to you 15 minutes of full attention before bed."},{"id":"F3","dim":"family","frame":"7d","ar":"خلال الأيام السبعة الماضية، كم مرة بادرت أنت بالتواصل مع أقاربك أو بمساعدتهم؟","en":"In the past 7 days, how many times did you reach out to relatives or help them, on your own initiative?","opts_ar":["لم أبادر، أو عند الضرورة فقط","مرة واحدة","مرتان إلى 3 مرات","4 مرات أو أكثر"],"opts_en":["I didn't, or only when needed","Once","2 to 3 times","4 times or more"],"ex_ar":"زيارة، اتصال، توصيل أو قضاء حاجة","ex_en":"A visit, a call, a lift or an errand","tip_ar":"اتصل بأحد أقاربك هذا الأسبوع، أو زره نصف ساعة.","tip_en":"Call a relative this week, or visit for half an hour."},{"id":"H1","dim":"health","frame":"7d","ar":"خلال الأيام السبعة الماضية، كم يوماً مارست نشاطاً بدنياً لمدة 30 دقيقة على الأقل؟","en":"In the past 7 days, on how many days were you physically active for at least 30 minutes?","opts_ar":["لم أمارس أي يوم","يوم إلى 3 أيام","4 إلى 5 أيام","6 إلى 7 أيام"],"opts_en":["Not a single day","1 to 3 days","4 to 5 days","6 to 7 days"],"ex_ar":"مشي، سباحة، دراجة، تمارين منزلية","ex_en":"Walking, swimming, cycling, home workouts","tip_ar":"امشِ 20 دقيقة بعد العشاء، ثلاثة أيام هذا الأسبوع.","tip_en":"Walk for 20 minutes after dinner, three days this week."},{"id":"H2","dim":"health","frame":"7d","ar":"خلال الأيام السبعة ال /* ---------- scoring engine (mirrors the Excel model) ---------- */
function compute(st){
  st=st||V;
  const w=C.WEIGHTS[st.stage]; const dims={};
  C.DIMENSIONS.forEach(d=>{const its=C.ITEMS.filter(i=>i.dim===d.key);dims[d.key]=its.reduce((s,i)=>s+st.a[i.id]*100/3,0)/its.length});
  const index=C.DIMENSIONS.reduce((s,d)=>s+w[d.key]*dims[d.key],0);
  const band=C.BANDS.find(b=>index>=b.min-1e-9);
  const vals=C.DIMENSIONS.map(d=>dims[d.key]);const mx=Math.max(...vals),mn=Math.min(...vals);const gap=mx-mn;
  const order=C.DIMENSIONS.map((d,i)=>({k:d.key,v:dims[d.key],w:w[d.key],i}));
  const weakest=order.slice().sort((a,b)=>a.v-b.v||b.w-a.w||a.i-b.i)[0].k;
  let persona;
  if(mn>=80-1e-9)persona="thriving";else if(index<50&&gap<25)persona="starting";else persona=weakest;
  const hours=C.TIME.T1.hours[st.t1];const share=C.ITEMS.find(i=>i.id==="D1").share[st.a.D1];
  const human=Math.round(hours*share*52),lost=Math.round(hours*(1-share)*52);
  const who=st.who.reduce((s,i)=>s+C.WHO5.values[i],0)*4;
  const whoBand=C.WHO_BANDS.find(b=>who>=b.min);
  const Q=C.QOL_WEIGHTS;const qol=Q.who5*who+Q.ls*st.ls*10+Q.energy*st.en*10;
  const qolBand=C.QOL_BANDS.find(b=>qol>=b.min-1e-9);
  const g=st.ls-st.en;const gapKey=g>=C.GAP_THRESHOLD?"sat_gt_energy":g<=-C.GAP_THRESHOLD?"energy_gt_sat":"aligned";
  const DRR=C.DRAIN_RULE;const dr=st.dr;
  const drainKey=(dr>=DRR.rel_min&&dr-st.en>=DRR.rel_gap)?"vs_energy":dr>=DRR.high_min?"high":dr>=DRR.mod_min?"moderate":"low";
  const drainLevel=C.DRAIN_LEVELS.find(b=>dr>=b.min);
  const okFeel=who>52, okHab=index>=65;
  const insight=okHab&&okFeel?"aligned_high":okHab?"habits_ok_feel_low":okFeel?"feel_ok_habits_low":"both_low";
  const items=C.ITEMS.map((it,i)=>({it,l:st.a[it.id],w:w[it.dim],i}));
  const plan=items.slice().sort((a,b)=>a.l-b.l||b.w-a.w||a.i-b.i).slice(0,3).map(x=>x.it);
  const task=C.TASKS[st.task],act=C.ACTIONS[st.act],rei=reinvestOpt(st.rei);
  const tip=C.SUGGEST[task.key][act.key];
  return {dims,index,band,gap,weakest,persona,hours,share,human,lost,who,whoBand,qol,qolBand,gapKey,drainKey,drainLevel,insight,plan,support:who<=28,task,act,rei,tip,hrsBack:st.hrs};
}
function reinvestOpt(i){const k=C.REINVEST_KEYS[i];return C.TIME.T2.opts.find(o=>o.key===k)}
function dimLabel(v){return C.DIM_LABELS.find(b=>v>=b.min-1e-9)}

function getPid(){
  let p=null;try{p=localStorage.getItem("ddl-pid")}catch(e){}
  if(!p||!/^[A-Z2-9]{6}$/.test(p)){p=memPid||randomPid();memPid=p;try{localStorage.setItem("ddl-pid",p)}catch(e){}}
  return p;
}
function randomPid(){const cs=C.PID_CHARS;let s="";const arr=new Uint32Array(6);try{crypto.getRandomValues(arr)}catch(e){for(let i=0;i<6;i++)arr[i]=Math.floor(Math.random()*1e9)}for(let i=0;i<6;i++)s+=cs[arr[i]%cs.length];return s}
function cohort(){let c="";try{const q=new URLSearchParams(location.search).get("g");if(q)c=q}catch(e){}if(!c&&location.hash)c=location.hash.slice(1);c=(c||"").toUpperCase();return /^[A-Z0-9]{1,10}$/.test(c)?c:""}
function seqOf(id){const h=history().slice().sort((a,b)=>a.id-b.id);const i=h.findIndex(x=>x.id===id);return Math.min(9,i<0?h.length+1:i+1)}
function buildCode(st,id){
  const v={stage:C.STAGES.findIndex(s=>s.key===st.stage),T1:st.t1,T2:C.TIME.T2.opts.map(o=>st.t2.includes(o.key)?1:0).join(""),
    LS:st.ls,EN:st.en,DR:st.dr,TASK:st.task,ACT:st.act,HRS:st.hrs,REI:st.rei,SEQ:seqOf(id),LANG:S.lang==="ar"?0:1};
  C.ITEMS.forEach(it=>v[it.id]=st.a[it.id]);st.who.forEach((x,k)=>v["W"+(k+1)]=C.WHO5.values[x]);
  const digits=C.CODE_FIELDS.map(([n,w])=>String(v[n]).padStart(w,"0")).join("");
  let chk=0;for(let i=0;i<digits.length;i++)chk+=(+digits[i])*(i+1);chk%=97;
  const c=cohort();return C.CODE_PREFIX+digits+String(chk).padStart(2,"0")+"-"+getPid()+(c?"-"+c:"");
}

function recordHistory(){

/* ---------- report card image (canvas keeps Arabic shaping correct) ---------- */
async function makeCard(R){
  try{await Promise.race([Promise.all([document.fonts.load('600 64px "Reem Kufi"'),document.fonts.load('500 30px "IBM Plex Sans Arabic"'),document.fonts.load('600 30px "IBM Plex Sans Arabic"')]),new Promise(r=>setTimeout(r,2500))])}catch(e){}
  const W=1080,H=1820,cv=document.createElement("canvas");cv.width=W;cv.height=H;const g=cv.getContext("2d");
  const rtl=S.lang==="ar";g.direction=rtl?"rtl":"ltr";const M=80;const X=rtl?W-M:M;const al=rtl?"right":"left";
  const ink="#14211C",muted="#5A6A62",acc="#175C4C",time="#B8730F",cols={family:"#B0435A",health:"#4A7F35",social:"#2A6A8C",digital:"#6556A3"};
  g.fillStyle="#F3F6F3";g.fillRect(0,0,W,H);

  g.font='600 150px "Reem Kufi", sans-serif';g.fillStyle=acc;g.fillText(String(r0(R.index)),X,530);
  const iw=g.measureText(String(r0(R.index))).width;
  g.font='500 32px "IBM Plex Sans Arabic", sans-serif';g.fillStyle=muted;
  const nx=rtl?X-iw-24:X+iw+24;g.fillText(t("rIndex")+" · "+t("outOf"),nx,470);
  g.fillStyle=ink;g.font='600 36px "IBM Plex Sans Arabic", sans-serif';g.fillText(L(R.band),nx,522);

  C.DIMENSIONS.forEach(d=>{const v=R.dims[d.key];
    g.fillStyle=ink;g.font='600 32px "IBM Plex Sans Arabic", sans-serif';g.textAlign=al;g.fillText(L(d),X,y);

    g.fillStyle="#E1E8E3";roundRect(g,M,y+18,BW,22,11);g.fill();

  g.textAlign=al;
  g.fillStyle="#F7EAD3";roundRect(g,M,y,BW,160,24);g.fill();
  if(R.hours>0){g.fillStyle=time;g.font='600 80px "Reem Kufi", sans-serif';g.fillText(String(R.human),rtl?X-40:X+40,y+105);
    const numW=g.measureText(String(R.human)).width;g.fillStyle=ink;g.font='500 30px "IBM Plex Sans Arabic", sans-serif';
    wrapText(g,hw(R.human)+" "+t("timeBigLabel"),rtl?X-40-numW-24:X+40+numW+24,y+78,BW-numW-110,40,al);}
  else{g.fillStyle=ink;g.font='500 28px "IBM Plex Sans Arabic", sans-serif';wrapText(g,t("timeNone"),rtl?X-40:X+40,y+62,BW-80,40,al);}
  y+=190;

function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function wrapText(g,text,x,y,max,lh,al){g.textAlign=al;const words=text.split(" ");let line="";for(const wd of words){const test=line?line+" "+wd:wd;if(g.measureText(test).width>max&&line){g.fillText(line,x,y);line=wd;y+=lh}else line=test}if(line){g.fillText(line,x,y);y+=lh}return y}

  const row=(n,v,pct,lab,col)=>'<div class="r"><div class="h"><b>'+esc(n)+'</b><span>'+esc(v)+'</span></div><div class="b"><i style="width:'+pct+"%;background:"+col+'"></i></div><small>'+esc(lab)+"</small></div>";
  const cols={family:"#B0435A",health:"#4A7F35",social:"#2A6A8C",digital:"#6556A3"};
  let b='<h1>'+esc(t("brand"))+'</h1><p class="m">'+esc(t("reportFile")+" · "+t("generated")+": "+today())+'</p>';
  b+='<h2>'+esc(t("personaOf")+": "+L(P))+'</h2><p>'+esc(rtl?P.d_ar:P.d_en)+'</p><p class="big">'+r0(R.index)+' <span>/ 100 · '+esc(t("rIndex")+" · "+L(R.band))+'</span></p><p>'+esc(rtl?R.band.msg_ar:R.band.msg_en)+'</p><p class="m">'+esc(t("rStage")+": "+L(stg))+"</p>";
  b+="<h2>"+esc(t("rQol"))+'</h2><p class="m">'+esc(t("rQolSub"))+'</p><p class="big q">'+r0(R.qol)+' <span>/ 100 · '+esc(L(R.qolBand))+"</span></p>"+
    row(t("who"),String(R.who),R.who,L(R.whoBand)+" · "+f(t("weight"),{w:Math.round(Q.who5*100)}),"#175C4C")+row(t("ls"),of10(st.ls),st.ls*10,f(t("weight"),{w:Math.round(Q.ls*100)}),"#B8730F")+row(t("en"),of10(st.en),st.en*10,f(t("weight"),{w:Math.round(Q.energy*100)}),"#4A7F35")+
    '<p class="m">'+esc(f(t("uaeRef"),{v:C.UAE_LADDER_2026}))+"</p><h3>"+esc(t("satEnergy"))+"</h3><p>"+esc(L(C.GAP_READINGS[R.gapKey]))+'</p><p class="m">'+esc(L(C.GAP_NOTE))+"</p><p><b>"+esc(L(C.INSIGHTS[R.insight]))+"</b></p>"+(R.support?'<p class="s">'+esc(f(t("support"),{n:C.SUPPORT_LINE}))+"</p>":"")+'<p class="m">'+esc(L(C.QOL_NOTE))+"</p>";
  b+="<h2>"+esc(t("rDrain"))+"</h2>"+row(t("drainLbl"),of10(st.dr),st.dr*10,f(t("level"),{l:L(R.drainLevel)}),"#A86A0C")+row(t("energyAvail"),of10(st.en),st.en*10,"","#4A7F35")+"<p>"+esc(L(C.DRAIN_READINGS[R.drainKey]))+'</p><p class="m">'+esc(L(C.DRAIN_NOTE))+"</p>";
  b+="<h2>"+esc(t("rDecision"))+'</h2><p class="big d">'+esc(decisionText(R))+"</p><p>"+esc(t("decHow")+(rtl?R.tip[0]:R.tip[1]))+"</p><p>"+esc(f(t("decTime"),{h:(rtl?HB.opts_ar:HB.opts_en)[st.hrs],r:L(R.rei)}))+"</p>";
  b+="<h2>"+esc(t("rDims"))+"</h2>"+C.DIMENSIONS.map(dd=>row(L(dd),String(r0(R.dims[dd.key])),r0(R.dims[dd.key]),L(dimLabel(R.dims[dd.key])),cols[dd.key])).join("")+'<p class="m">'+esc(f(t("gap"),{n:r0(R.gap)}))+"</p>";
  b+="<h2>"+esc(t("rTime"))+"</h2>"+(R.hours>0?"<p>"+esc(f(t("timeSaved"),{h:fmtH(R.hours),p:Math.round(R.share*100)}))+'</p><p class="big t">'+R.human+" <span>"+esc(hw(R.human)+" "+t("timeBigLabel"))+"</span></p>"+(R.lost>0?"<p>"+esc(f(t("timeLost"),{n:R.lost,u:hw(R.lost)}))+"</p>":""):"<p>"+esc(t("timeNone"))+"</p>");
  b+="<h2>"+esc(t("rPlan"))+"</h2><ul>"+R.plan.map(it=>"<li>"+esc(rtl?it.tip_ar:it.tip_en)+"</li>").join("")+"</ul><p>"+esc(t("tipLabel")+L(C.DIGITAL_TIP))+"</p>";
  b+="<h3>"+esc(t("answers"))+"</h3><table>"+C.ITEMS.map(it=>"<tr><td>"+esc(L(it))+"</td><td>"+esc((rtl?it.opts_ar:it.opts_en)[st.a[it.id]])+"</td></tr>").join("")+
    "<tr><td>"+esc(L(C.LIFE_SAT))+"</td><td>"+esc(of10(st.ls))+"</td></tr><tr><td>"+esc(L(C.ENERGY))+"</td><td>"+esc(of10(st.en))+"</td></tr><tr><td>"+esc(L(C.DRAIN))+"</td><td>"+esc(of10(st.dr))+"</td></tr></table>";
  b+='<p class="m">'+esc(t("codeLbl")+": ")+'<span dir="ltr">'+esc(buildCode(st,pastEntry?pastEntry.id:S.runId))+'</span></p><p class="m">'+esc(t("retake"))+'</p><p class="m">'+esc(t("disclaimer"))+"</p>";
  return '<!doctype html><html lang="'+S.lang+'" dir="'+(rtl?"rtl":"ltr")+'"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(t("brand"))+"</title><style>body{font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;max-width:720px;margin:24px auto;padding:0 16px;color:#14211C;background:#fff;line-height:1.7}h1{color:#175C4C;margin-bottom:0}h2{margin-top:28px;border-bottom:2px solid #DCEDE6;padding-bottom:4px}.m{color:#5A6A62;font-size:14px}.big{font-size:44px;font-weight:700;color:#175C4C;margin:8px 0}.big span{font-size:18px;color:#14211C;font-weight:600}.big.t{color:#B8730F}.big.q{color:#2A6A8C}.big.d{font-size:28px}.r{margin:10px 0}.h{display:flex;justify-content:space-between}.b{height:10px;background:#E9EFEA;border-radius:10px;overflow:hidden}.b i{display:block;height:100%}small{color:#5A6A62}table{border-collapse:collapse;width:100%;font-size:14px}td{border-bottom:1px solid #D6DFD9;padding:6px 4px;vertical-align:top}td:last-child{width:38%;font-weight:600}.s{background:#F6E1DF;padding:10px;border-radius:8px}</style></head><body>"+b+"</body></html>";
}

/* ---------- actions ---------- */
function go(step){S.step=step;S.tried=false;save();render();window.scrollTo({top:0,behavior:"auto"})}
function render(){header();
  if(S.view==="dash")return vDash();
  if(pastEntry)return vReport();
  V=S;
  if(S.step<0)return vIntro();
  if(S.step===0)return vStage();
  if(S.step>=1&&S.step<=3)return vDim();
  if(S.step===4)return vTime();
  if(S.step===5)return vFeel();
  if(S.step===6)return vDecision();
  return vReport();
}
function toast(id,msg){const el=document.getElementById(id);if(el)el.textContent=msg}
function keepScroll(fn){const y=window.scrollY;fn();window.scrollTo(0,y)}
app.addEventListener("change",e=>{
  const el=e.target;if(!el.name)return;
  const n=el.name,v=+el.value;
  if(n==="stage")S.stage=C.STAGES[v].key;
  else if(n==="T1"){const had=S.t1;S.t1=v;if(S.t1===0)S.t2=[];save();if((had==null||had===0)!==(S.t1===0)){keepScroll(render);const r=document.getElementById("T1-"+S.t1);if(r)r.focus();return}}
  else if(n==="T2"){S.t2=[...app.querySelectorAll('input[name="T2"]:checked')].map(x=>x.value)}
  else if(n==="LS")S.ls=v;else if(n==="EN")S.en=v;else if(n==="DR")S.dr=v;
  else if(n==="TASK"||n==="ACT"){S[n==="TASK"?"task":"act"]=v;save();keepScroll(render);const r=document.getElementById(n+"-"+v);if(r)r.focus();return}
  else if(n==="HRS")S.hrs=v;else if(n==="REI")S.rei=v;
  else if(/^W\d$/.test(n))S.who[+n.slice(1)]=v;
  else S.a[n]=v;
  save();const w=document.getElementById("warn");if(w&&complete())w.textContent="";
});
app.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const act=b.dataset.act;
  if(act==="start"){S.runId=Date.now();go(0)}
  else if(act==="resume"){if(!S.runId)S.runId=Date.now();go(firstIncomplete())}
  else if(act==="restart"){Object.assign(S,BLANK());S.runId=Date.now();caps.pilotState="";clearArmed=false;go(0)}
  else if(act==="back"){go(S.step-1)}
  else if(act==="next"){if(!complete()){S.tried=true;const w=document.getElementById("warn");if(w)w.textContent=t("missing");return}if(S.step===6)recordHistory();go(S.step+1)}
  else if(act==="past"){const en=history().find(x=>String(x.id)===b.dataset.id);if(!en||!en.snap)return;pastEntry=en;V=Object.assign({},en.snap);render();window.scrollTo(0,0)}
  else if(act==="pastBack"){pastEntry=null;V=S;render();window.scrollTo(0,0)}
  else if(act==="clearHist"){if(!clearArmed){clearArmed=true;b.textContent=t("histConfirm");return}try{localStorage.removeItem("ddl-history")}catch(err){}clearArmed=false;pastEntry=null;V=S;keepScroll(render);toast("htoast",t("histCleared"))}
  else if(act==="copy"){const txt=summaryText(compute(),V);try{await navigator.clipboard.writeText(txt);toast("toast",t("copied"))}catch(err){const box=document.getElementById("copybox");box.hidden=false;box.focus();box.select();toast("toast",t("copyFallback"))}}
  else if(act==="png"||act==="html"){if(!caps.dl&&!STANDALONE){toast("toast",t("saveUnavailable"));return}
    const R=compute();try{const data=act==="png"?await makeCard(R):reportHTML(R,V);const fn=act==="png"?"dignified-digital-life-card.png":"dignified-digital-life-report.html";
      if(caps.dl)await caps.dl.save({filename:fn,data});else nativeSave(fn,data);toast("toast",t("saved"))}
    catch(err){try{console.warn("save failed",err)}catch(e){}toast("toast",err&&err.code==="declined"?t("declined"):t("saveUnavailable"))}}
  else if(act==="pid"){const inp=document.getElementById("pidIn");const v=(inp&&inp.value||"").trim().toUpperCase();
    if(!/^[A-Z2-9]{6}$/.test(v)){toast("pidToast",t("pidBad"));return}memPid=v;try{localStorage.setItem("ddl-pid",v)}catch(err){}keepScroll(render);toast("pidToast",t("pidOk"))}
  else if(act==="pilot"){await addPilot()}
});
document.getElementById("langBtn").addEventListener("click",()=>{S.lang=S.lang==="ar"?"en":"ar";save();render()});
document.getElementById("dashBtn").addEventListener("click",()=>{S.view=S.view==="dash"?"survey":"dash";pastEntry=null;V=S;render()});
function firstIncomplete(){for(let s=0;s<=6;s++){if(!complete(s))return s}return REPORT}

/* ---------- pilot data inside Claude (org members only) ---------- */
async function addPilot(){
  const R=compute(S);
  try{const id=await caps.user.id();if(!id)throw new Error("no id");
    const d=new Date();
    await caps.db.doc("responses/"+id).set({stage:S.stage,lang:S.lang,month:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"),
      family:r0(R.dims.family),health:r0(R.dims.health),social:r0(R.dims.social),digital:r0(R.dims.digital),
      index:r0(R.index),band:R.band.min,who5:R.who,ls:S.ls,en:S.en,qol:r0(R.qol),dr:S.dr,gap:R.gapKey,
      hours:R.hours,share:R.share,human:R.human,where:S.t2.slice(),task:R.task.key,act:R.act.key,hrs:S.hrs,rei:C.REINVEST_KEYS[S.rei]});
    caps.pilotState="done";
  }catch(err){caps.pilotState="err";if(err&&err.code==="invalid_argument")caps.canWrite=false}
  if(S.view==="survey"&&S.step===REPORT&&!pastEntry)keepScroll(render);
}
let unsub=null,dashRows=null,dashErr=false;
function vDash(){
  if(!unsub&&caps.db){dashRows=null;unsub=caps.db.collection("responses").onSnapshot(s=>{dashRows=s.docs.map(x=>x.data());if(S.view==="dash")vDash()},()=>{dashErr=true;if(S.view==="dash")vDash()})}
  let h='<section class="view report"><h1 style="font-size:clamp(24px,5vw,30px)">'+esc(t("dash"))+'</h1><p class="note">'+esc(t("dashNote"))+"</p>";
  if(dashErr){app.innerHTML=h+'<div class="card"><p>'+esc(t("dashErr"))+"</p></div></section>";return}
  if(dashRows==null){app.innerHTML=h+'<div class="card"><p>'+esc(t("dashLoading"))+"</p></div></section>";return}
  if(!dashRows.length){app.innerHTML=h+'<div class="card"><p>'+esc(t("dashEmpty"))+"</p></div></section>";return}
  const rows=dashRows,n=rows.length,has=k=>rows.filter(r=>typeof r[k]==="number"),avg=k=>{const a=has(k);return a.length?a.reduce((s,r)=>s+r[k],0)/a.length:0};
  h+='<div class="kpis"><div class="kpi"><b class="num">'+n+'</b><span>'+esc(t("kN"))+'</span></div><div class="kpi"><b class="num">'+r0(avg("index"))+'</b><span>'+esc(t("kIdx"))+'</span></div><div class="kpi"><b class="num">'+r0(avg("qol"))+'</b><span>'+esc(t("kQol"))+'</span></div><div class="kpi"><b class="num">'+avg("dr").toFixed(1)+'</b><span>'+esc(t("kDrain"))+'</span></div><div class="kpi"><b class="num">'+rows.reduce((s,r)=>s+(+r.human||0),0).toLocaleString("en-US")+'</b><span>'+esc(t("kHours"))+"</span></div></div>";
  const hb=(list)=>{const mx=Math.max(...list.map(x=>x[1]),1);return '<div class="hbars">'+list.map(([l,v,txt,max])=>'<div class="hbar"><span>'+esc(l)+'</span><div class="t"><i style="width:'+(v/(max||mx)*100)+'%"></i></div><span class="num">'+(txt==null?v:txt)+"</span></div>").join("")+"</div>"};
  h+='<div class="card"><h3>'+esc(t("dDims"))+"</h3>"+hb(C.DIMENSIONS.map(d=>[L(d),avg(d.key),r0(avg(d.key)),100]))+"</div>";
  h+='<div class="card"><h3>'+esc(t("dQol"))+"</h3>"+hb([[t("who"),avg("who5"),r0(avg("who5")),100],[t("ls"),avg("ls")*10,avg("ls").toFixed(1),100],[t("en"),avg("en")*10,avg("en").toFixed(1),100],[t("drainLbl"),avg("dr")*10,avg("dr").toFixed(1),100]])+"</div>";
  h+='<div class="card"><h3>'+esc(t("dGap"))+"</h3>"+hb(Object.keys(t("gapNames")).map(k=>[t("gapNames")[k],rows.filter(r=>r.gap===k).length]))+"</div>";
  h+='<div class="card"><h3>'+esc(t("dActions"))+"</h3>"+hb(C.ACTIONS.map(a=>[S.lang==="ar"?a.noun_ar:a.verb_en,rows.filter(r=>r.act===a.key).length]))+hb(C.TASKS.map(k=>[L(k),rows.filter(r=>r.task===k.key).length]))+"</div>";
  h+='<div class="card"><h3>'+esc(t("dBands"))+"</h3>"+hb(C.BANDS.map(b=>[L(b),rows.filter(r=>r.band===b.min).length]))+"</div>";
  h+='<div class="card"><h3>'+esc(t("dStages"))+"</h3>"+hb(C.STAGES.map(s=>[L(s),rows.filter(r=>r.stage===s.key).length]))+"</div>";
  h+='<div class="card"><h3>'+esc(t("dWhere"))+"</h3>"+hb(C.TIME.T2.opts.map(o=>[L(o),rows.filter(r=>Array.isArray(r.where)&&r.where.includes(o.key)).length]))+"</div></section>";
  app.innerHTML=h;
}

/* ---------- boot ---------- */
load();render();
(async function(){
  if(!window.claude||!window.claude.use){
    /* hosted copy: the Forms link lives in config.json so it can change without touching this page */
    try{const r=await fetch("config.json",{cache:"no-store"});if(r.ok){const cfg=await r.json();
      if(cfg&&typeof cfg.forms_prefill_url==="string"&&cfg.forms_prefill_url.indexOf(C.FORMS.placeholder)>0){C.FORMS.prefill_url=cfg.forms_prefill_url;if(S.view==="survey"&&S.step===REPORT)keepScroll(render)}}}catch(e){}
    return;
  }
  try{caps.dl=await window.claude.use("downloads")}catch(e){}
  try{caps.user=await window.claude.use("user");caps.db=await window.claude.use("db");
    if(caps.user&&caps.db){caps.isAdmin=!!(await caps.user.canEdit());const cw=await caps.user.can("data.write");caps.canWrite=cw!==false}
  }catch(e){}
  if(S.view==="survey")render();else header();
})();
})();
</script>
